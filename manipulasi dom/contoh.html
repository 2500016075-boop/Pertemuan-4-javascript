<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulasi DOM</title>
    <style>
        body {
            max-width: 600px;
            margin: 60px auto;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #f4f4f4;
        }

        h1 {
            margin-bottom: 8px;
        }

        .description {
            margin-bottom: 24px;
            color: #666;
        }

        #output3 {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        #output3 button {
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            background-color: #4f46e5;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        #output3 button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>
    <h1>Manipulasi DOM</h1>
    <p class="description">Klik tombol untuk mengubah tampilan halaman.</p>
    <div id="output3" aria-label="Aksi manipulasi tampilan"></div>
    <script src="interactive.js"></script>
</body>
</html>
