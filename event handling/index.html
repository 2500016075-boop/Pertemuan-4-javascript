<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handling - Validasi Form</title>
    <style>
        body {
            max-width: 600px;
            margin: 60px auto;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #f4f4f4;
        }

        #output4 {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
        }

        input {
            margin: 8px 0;
            padding: 8px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }

        button {
            margin-top: 12px;
            padding: 9px 16px;
            border: 0;
            border-radius: 5px;
            background-color: #4f46e5;
            color: white;
            cursor: pointer;
        }

        #error-message {
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <h1>Validasi Form</h1>
    <p>Isi nama dan email, lalu tekan tombol submit.</p>
    <div id="output4"></div>
    <script src="SCRIPT.js"></script>
</body>
</html>
